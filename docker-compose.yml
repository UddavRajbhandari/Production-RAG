# Production RAG Pipeline — Local Dev
# Connects to cloud services (Qdrant Cloud, Neon) via .env

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: production-rag-api
    ports:
      - "7860:7860"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
