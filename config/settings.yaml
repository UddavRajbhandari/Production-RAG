# Production RAG Pipeline Configuration
# Project 02 | Version 1.1

ingestion:
  chunk_size: 512
  chunk_overlap: 50
  min_char_threshold: 100
  window_size: 3
  table_extraction: true
  chunker_type: "structure_aware"  # Options: "structure_aware", "naive"
  # "naive" = simple fixed-token chunks, no table/code preservation
  # "structure_aware" = respects document structure (tables, code blocks, headings)

  department_mapping:
    worldbank: "Financial"
    world-bank-access-to-information: "Financial"
    wbg-a2i: "Financial"
    ati-annual-report: "Financial"
    access-to-i: "Financial"
    imf: "Financial"
    annual-report: "Financial"
    budget: "Financial"
    fiscal: "Financial"
    "2508.": "Academic"
    "2604.": "Academic"
    "2605.": "Academic"
    arxiv: "Academic"
    paper: "Academic"
    research: "Academic"
    fao_: "Academic"
    chipfabric: "Technical"
    deepeval: "Technical"
    chiplingo: "Technical"
    python: "Technical"
    wb_clear: "Technical"

storage:
  qdrant:
    collection_name: "production_rag_v1"
    vector_size: 384
    distance: "Cosine"
    host: "localhost"
    port: 6333
    # Auto-appends "_naive" or "_structure_aware" based on chunker_type
    # Set use_chunker_suffix: false to disable this behavior
    use_chunker_suffix: true
  bm25:
    persist_path: "storage/bm25_index.pkl"
    use_chunker_suffix: true
  postgres:
    schema_name: "rag_pipeline"
    use_chunker_suffix: true

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  rrf_k: 60
  rerank_top_n: 7
  rerank_pool_size: 15

models:
  embedding: "sentence-transformers/all-MiniLM-L6-v2"
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# =============================================================================
# DYNAMIC LLM PROVIDER CONFIGURATION
# =============================================================================
#
# The engine will automatically try these profiles in order.
# First one with a valid API key or reachable endpoint wins.
#
llm:
  provider: "openrouter"  # Auto-detect: groq -> openai -> openrouter -> huggingface -> ollama

  profiles:
    groq:
      type: "api"
      env_key: "GROQ_API_KEY"
      endpoint: "https://api.groq.com/openai/v1/chat/completions"
      model: "llama-3.3-70b-versatile"
      timeout: 60

    openai:
      type: "api"
      env_key: "OPENAI_API_KEY"
      endpoint: "https://api.openai.com/v1/chat/completions"
      model: "gpt-4o-mini"
      timeout: 60

    openrouter:
      type: "api"
      env_key: "OPENROUTER_API_KEY"
      endpoint: "https://openrouter.ai/api/v1/chat/completions"
      model: "meta-llama/llama-3.1-8b-instruct"
      timeout: 60

    huggingface:
      # Disabled: HF Inference API not available on free tier
      # Use Groq (when quota available) -> Ollama (fallback) instead
      type: "api"
      env_key: "HF_TOKEN"
      endpoint: "https://api-inference.huggingface.co/models/meta-llama/Llama-3.1-8B-Instruct"
      model: "meta-llama/Llama-3.1-8B-Instruct"
      timeout: 60

    ollama:
      type: "ollama"
      url: "http://localhost:11434/api/generate"
      model: "llama3:8b-instruct-q4_K_M"
      timeout: 1800  # 30 minutes for CPU inference

latency:
  total_p95_ms: 180000
  generation_budget_ms: 30000
  retrieval_budget_ms: 500  # Budget for dense+sparse retrieval
  rerank_budget_ms: 1000    # Budget for cross-encoder reranking

evaluation:
  ragas:
    alert_threshold_cp: 0.75
    alert_threshold_faith: 0.80
    alert_threshold_ar: 0.75
    alert_threshold_cr: 0.75
    reindex_trigger_cp: 0.75
    production_sample_rate: 0.05

  ground_truth:
    path: "data/ground_truth/ground_truth.json"
    golden_set_ci: "data/ground_truth/golden_set_ci.json"
    min_pairs: 50

logging:
  level: "INFO"
  format: "json"
  per_query_fields:
    - retrieval_latency_ms
    - rerank_latency_ms
    - generation_latency_ms
    - total_latency_ms
    - validation_passed
    - cost_usd
