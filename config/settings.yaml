guardrails:
  pii:
    enabled: true
    sensitivity_threshold: 3
  semantic_cache:
    enabled: true
    similarity_threshold: 0.92
    max_size: 256
    ttl_seconds: 3600
  token_budget:
    enabled: true
    max_query_tokens: 2000
    max_context_tokens: 8000
    max_total_tokens: 30000
  prompt_injection:
    enabled: true

monitoring:
  metrics:
    enabled: true
    prometheus_buckets:
      - 0.1
      - 0.5
      - 1.0
      - 5.0
      - 30.0
      - 60.0
      - 120.0
      - 180.0
  sentry:
    traces_sample_rate: 0.1
    send_default_pii: false

evaluation:
  ground_truth:
    golden_set_ci: data/ground_truth/golden_set_ci.json
    min_pairs: 50
    path: data/ground_truth/ground_truth.json
  ragas:
    alert_threshold_ar: 0.75
    alert_threshold_cp: 0.75
    alert_threshold_cr: 0.75
    alert_threshold_faith: 0.8
    production_sample_rate: 0.05
    reindex_trigger_cp: 0.75
ingestion:
  chunk_overlap: 50
  chunk_size: 512
  chunker_type: structure_aware # naive or structure_aware
  department_mapping:
    '2508.': Academic
    '2604.': Academic
    '2605.': Academic
    access-to-i: Financial
    annual-report: Financial
    arxiv: Academic
    ati-annual-report: Financial
    budget: Financial
    chipfabric: Technical
    chiplingo: Technical
    deepeval: Technical
    fao_: Academic
    fiscal: Financial
    imf: Financial
    paper: Academic
    python: Technical
    research: Academic
    wb_clear: Technical
    wbg-a2i: Financial
    world-bank-access-to-information: Financial
    worldbank: Financial
  min_char_threshold: 100
  table_extraction: true
  window_size: 3
latency:
  generation_budget_ms: 30000
  rerank_budget_ms: 1000
  retrieval_budget_ms: 500
  total_p95_ms: 180000
llm:
  profiles:
    groq:
      endpoint: https://api.groq.com/openai/v1/chat/completions
      env_key: GROQ_API_KEY
      model: llama-3.3-70b-versatile
      timeout: 60
      type: api
    huggingface:
      endpoint: https://api-inference.huggingface.co/models/meta-llama/Llama-3.1-8B-Instruct
      env_key: HF_TOKEN
      model: meta-llama/Llama-3.1-8B-Instruct
      timeout: 60
      type: api
    ollama:
      model: llama3:8b-instruct-q4_K_M
      timeout: 1800
      type: ollama
      url: http://localhost:11434/api/generate
    openai:
      endpoint: https://api.openai.com/v1/chat/completions
      env_key: OPENAI_API_KEY
      model: gpt-4o-mini
      timeout: 60
      type: api
    openrouter:
      endpoint: https://openrouter.ai/api/v1/chat/completions
      env_key: OPENROUTER_API_KEY
      model: google/gemini-2.0-flash-exp:free # meta-llama/llama-3.1-8b-instruct # mistralai/mistral-small-3.1-24b-instruct:free
      timeout: 60
      type: api
  provider: auto # auto, groq, openai, openrouter, or ollama
logging:
  format: json
  level: INFO
  per_query_fields:
  - retrieval_latency_ms
  - rerank_latency_ms
  - generation_latency_ms
  - total_latency_ms
  - validation_passed
  - cost_usd
models:
  embedding: sentence-transformers/all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
retrieval:
  dense_top_k: 20
  rerank_pool_size: 15
  rerank_top_n: 7
  rrf_k: 60
  sparse_top_k: 20
storage:
  # Qdrant Configuration
  # Cloud (production): Set QDRANT_URL and QDRANT_API_KEY env vars
  # Local (development): Uses host:port below
  qdrant:
    # Cloud settings (uncomment and set env vars for production)
    # qdrant_url: https://your-cluster.qdrant.cloud
    # api_key: ${QDRANT_API_KEY}  # Use env var in production

    # Local/Docker settings (used when QDRANT_URL not set)
    collection_name: production_rag_v1
    distance: Cosine
    host: localhost
    port: 6333
    use_chunker_suffix: true
    vector_size: 384

    # Cloud-specific: auto-enabled when QDRANT_URL is set
    # Enables sparse vectors for native BM25 support
    enable_sparse_vectors: true

  # BM25 Configuration
  # Cloud mode: Uses Qdrant native sparse vectors (no local file)
  # Local mode: Uses pickle file below
  bm25:
    persist_path: storage/bm25_index.pkl
    use_chunker_suffix: true

  # Neon/Postgres Configuration
  # Cloud (production): Set DATABASE_URL env var
  # Local (development): Uses SQLite fallback
  postgres:
    # Cloud: Set DATABASE_URL=postgres://...neon.tech/rag?sslmode=require
    # Local: Uses storage/rag_sqlite.db
    schema_name: rag_pipeline
    use_chunker_suffix: true
