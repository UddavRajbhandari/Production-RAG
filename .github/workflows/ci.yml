name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Lint & Type Check ─────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format --check .

      - name: Run Mypy
        run: mypy src

  # ── Job 2: Unit & Integration Tests ─────────────────────────────────────────
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality                       # only run if quality passes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Validate Ground Truth Schema
        run: |
          python src/evaluation/validate_ground_truth.py data/ground_truth/ground_truth.json

      - name: Run Unit Tests
        run: pytest tests/unit -v

      - name: Run Integration Tests
        run: pytest tests/integration -v

  # ── Job 3: RAGAS Regression Guard ────────────────────────────────────────────
  # Runs a fast RAGAS evaluation on a small golden QA set (10–15 pairs).
  # Fails the pipeline if Context Precision drops below 0.75 or
  # Faithfulness drops below 0.80, as defined in config/settings.yaml.
