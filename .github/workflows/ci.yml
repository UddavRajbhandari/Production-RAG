name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint & Type Check ─────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.4 mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Ruff (lint)
        run: ruff check . --config pyproject.toml

      - name: Run Ruff Format Check
        run: ruff format --check . --config pyproject.toml

      - name: Run Mypy
        run: mypy src --config pyproject.toml

  # ── Job 2: Unit & Integration Tests ─────────────────────────────────────────
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Validate Ground Truth Schema
        run: |
          python src/evaluation/validate_ground_truth.py data/ground_truth/ground_truth.json

      - name: Run Unit Tests
        run: pytest tests/unit -v --ignore=tests/integration

  # ── Job 3: RAGAS Regression Guard ────────────────────────────────────────────
  # Runs evaluation on a subset of golden QA pairs.
  # Fails if metrics drop below thresholds.
  #
  # Requires OPENROUTER_API_KEY secret to be set in GitHub Actions.
  ragas-regression:
    name: RAGAS Regression Guard
    runs-on: ubuntu-latest
    needs: tests
    # Uncomment to enable (requires OPENROUTER_API_KEY secret):
    # env:
    #   OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Quick check - validates script can be imported
      - name: Validate RAGAS Script
        run: |
          python -c "from src.evaluation.evaluate_ragas import main; print('RAGAS script OK')"

      # Full RAGAS evaluation can be run locally with:
      # python src/evaluation/evaluate_ragas.py --golden-set data/ground_truth/golden_set_ci.json
      #
      # To enable full CI RAGAS:
      # 1. Create a golden_set_ci.json with 10-15 representative QA pairs
      # 2. Set OPENROUTER_API_KEY in GitHub Actions secrets
      # 3. Uncomment the step below:
      # - name: Run RAGAS Evaluation
      #   run: |
      #     python src/evaluation/evaluate_ragas.py \
      #       --golden-set data/ground_truth/golden_set_ci.json \
      #       --output ragas_results.json

  # ── Job 4: Docker Build Check (disabled until Phase 8) ───────────────────────
  docker-build:
    if: false
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - run: echo "Docker build disabled until Phase 8"
