name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint & Type Check ─────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.4 mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Ruff (lint)
        run: ruff check . --config pyproject.toml

      - name: Run Ruff Format Check
        run: ruff format --check . --config pyproject.toml

      - name: Run Mypy
        run: mypy src --config pyproject.toml

  # ── Job 2: Unit & Integration Tests ─────────────────────────────────────────
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Validate Ground Truth Schema
        run: |
          python src/evaluation/validate_ground_truth.py data/ground_truth/ground_truth.json

      - name: Run Unit Tests
        run: pytest tests/unit -v --ignore=tests/integration

  # ── Job 3: RAGAS Regression Guard ────────────────────────────────────────────
  # Runs evaluation on a subset of golden QA pairs.
  # Fails if metrics drop below thresholds.
  #
  # Requires OPENROUTER_API_KEY secret to be set in GitHub Actions.
  ragas-regression:
    name: RAGAS Regression Guard
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Validate Golden Set Exists
        run: |
          test -f data/ground_truth/golden_set_ci.json && echo "Golden set found" || echo "Golden set not found"

      - name: Run RAGAS Regression Check
        run: |
          python scripts/validate_ragas_regression.py --golden-set data/ground_truth/golden_set_ci.json

  # ── Job 4: Docker Build ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t production-rag:${{ github.sha }} .

      - name: Verify image runs
        run: docker run --rm production-rag:${{ github.sha }} python -c "import src; print('Build OK')"
